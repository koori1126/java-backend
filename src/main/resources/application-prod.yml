# 本番/検証環境用設定。値は環境変数または k8s の ConfigMap/Secret から注入する
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5444}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000

  jpa:
    show-sql: false

logging:
  level:
    com.example.backend: INFO
