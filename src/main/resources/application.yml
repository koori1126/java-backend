spring:
  application:
    name: backend-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      # CSV一括登録用。大きめのCSVを想定して上限を設定(必要に応じて調整)
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  # DBのスネークケース(created_at等)とJavaのキャメルケース(createdAt等)を
  # 自動的に対応付ける(各Mapper XMLのresultMapは明示しているため、
  # 実質的には保険的な設定)。
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      # 同時に処理できるリクエスト数の上限(これを超えるとキューで待機する)。
      # デフォルトのままでも通常は問題ないが、負荷状況に応じて調整する。
      max: ${TOMCAT_THREADS_MAX:200}
      min-spare: ${TOMCAT_THREADS_MIN_SPARE:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true   # 監視/死活監視ツールからの死活確認用に /actuator/health/liveness, /readiness を有効化

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
